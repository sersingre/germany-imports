<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deutschlands Außenhandel</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
  <!-- Header Section -->
  <div id="header"></div>
  
  <section class="text-dark pt-3">
    <div class="container">
      <div class="d-lg-flex gap-2">
        <div class="flex-grow-1">
          <h2 class="fw-bold">Die wichtigsten Handelspartner</h2>
          <p class="small">Rangfolge nach Außenhandelswerten in Milliarden Euro.</p>    
        </div>
        <div class="d-flex align-self-start gap-2">
          <button type="button" class="btn btn-outline-secondary" data-bs-toggle="button">2025</button>
          <button type="button" class="btn btn-outline-secondary" data-bs-toggle="button">2026&nbsp;Jan&#8209;Jul</button>
        </div>
      </div>
      
      <div class="row g-2 my-2">
        <div class="col-md">
          <div class="card">
            <div class="card-body">
              <p class="card-title fw-bold fs-5">Exportländer</p>
              <p class="small text-muted">Deutsche Waren gehen in diese Länder.</p>
              <div class="table-responsive">
                <table class="table align-middle">
                  <tbody>
                    <tr>
                      <td>1</td>
                      <td>
                        <small>Vereinigte Staaten</small>
                        <div class="progress" role="progressbar" aria-valuenow="50" aria-valuemin="0" aria-valuemax="100" style="height: 5px">
                          <div class="progress-bar" style="width: 50%"></div>
                        </div>
                      </td>
                      <td>147,0</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
        
        
        <div class="col-md">
          <div class="card">
            <div class="card-body">
              <p class="card-title fw-bold fs-5">Importländer</p>
              <p class="small text-muted">Aus diesen Ländern kommen Waren nach Deutschland.</p>
              <div class="table-responsive">
                <table class="table">
                  <tbody>
                    <tr>
                      <td>1</td>
                      <td>
                        <small>Vereinigte Staaten</small>
                        <div class="progress" role="progressbar" aria-valuenow="50" aria-valuemin="0" aria-valuemax="100" style="height: 5px">
                          <div class="progress-bar" style="width: 50%"></div>
                        </div>
                      </td>
                      <td>147,0</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>

      
    </div>
  </section>

  <!-- Footer Section -->
  <div id="footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
  <script src="shared.js"></script>  
</body>
</html>
